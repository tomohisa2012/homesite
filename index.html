<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickTools</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="window">

  <div class="titlebar">
    <span>🛠️ QuickTools</span>

    <div>
      <button>＿</button>
      <button>□</button>
      <button>×</button>
    </div>
  </div>

  <div class="toolbar">
    <button onclick="loadTool('home')">🏠 ホーム</button>
    <button onclick="loadTool('password')">🔑 パスワード</button>
    <button onclick="loadTool('counter')">🔢 文字数</button>
    <button onclick="loadTool('calculator')">🧮 電卓</button>
    <button onclick="loadTool('color')">🎨 色</button>
    <button onclick="loadTool('url')">🔗 URL</button>
    <button onclick="loadTool('json')">📋 JSON</button>
    <button onclick="loadTool('uuid')">🆔 UUID</button>
    <button onclick="loadTool('timer')">⏱️ タイマー</button>
    <button onclick="loadTool('textfile')">📄 TXT</button>
  </div>

  <div class="content">

    <aside>
      <h3>ツール</h3>

      <button onclick="loadTool('password')">🔑 パスワード生成</button>
      <button onclick="loadTool('counter')">🔢 文字数カウント</button>
      <button onclick="loadTool('calculator')">🧮 電卓</button>
      <button onclick="loadTool('color')">🎨 HEX / RGB</button>
      <button onclick="loadTool('url')">🔗 URL変換</button>
      <button onclick="loadTool('json')">📋 JSON整形</button>
      <button onclick="loadTool('uuid')">🆔 UUID生成</button>
      <button onclick="loadTool('timer')">⏱️ タイマー</button>
      <button onclick="loadTool('textfile')">📄 TXT作成</button>
    </aside>

    <main id="app"></main>

  </div>

  <footer>
    QuickTools — 完全ブラウザ動作
  </footer>

</div>

<script src="script.js"></script>

</body>
</html>
